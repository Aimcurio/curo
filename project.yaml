name: Curo
slug: curo
description: >-
  Small, modular, model-agnostic framework around which reusable AI capabilities
  can be built, composed, replaced, and evolved. Skills, agents, nodes,
  validators, workflows, governance, observability, execution systems, research
  systems, adapters, and other capabilities are extensions and do not define
  Curo core by themselves.
version: 1.8.3
status: active
maturity: foundation
runtime_status: implemented_and_regression_tested
created_at: 2026-09-05
updated_at: 2026-09-08
language: en
source:
  conversation_id: 6a9c0aab-cc98-83e8-9a95-2fea63283d6e
  conversation_title: Project Ideas for GPT Astra
  basis: latest conversation content plus approved core-minimalism and goal-driven deep research extensions
  authority_note: >-
    This package is authoritative for the repository unless later superseded by
    an explicit approved architecture decision. Extension maturity must not be
    treated as evidence of a change to Curo core identity.
lineage:
  standard_family: model-agnostic-ai-systems-operating-standard
  addendum_family: addendum-a
  revision: I
  canonical_document: docs/operating-standard.md
  core_identity: core-policies/core-identity.md
  drift_gate: core-policies/drift-check.md
core:
  principle: core_minimalism
  identity: small_modular_model_agnostic_framework
  extension_default: true
  core_redefinition_requires_explicit_requester_approval: true
  prohibited_capture_sources:
    - skill
    - agent
    - node
    - feature
    - workflow
    - harness
    - governance
    - validator
    - observability
    - execution_system
    - research_system
    - adapter
ownership:
  objective: human_or_authorized_caller
  core_identity: requester_approved_architecture
  operational_state: selected_runtime_or_harness_when_applicable
  prompt_template: versioned_artifact
  context_selection: selected_context_builder_under_policy
  tool_authority: selected_runtime_policy_or_guard
  execution: selected_execution_extension
  validation: deterministic_validator_where_feasible
  provenance: selected_provenance_extension
  evidence_persistence: selected_evidence_extension
  execution_replay_manifests: selected_replay_extension
  artifact_verification_manifests: selected_verification_extension
  observability: selected_observability_extension
  learning_distillation: selected_learning_extension
  capability_measurements: evaluation_pipeline
  pending_decisions: human_or_authorized_caller
  project_profile_intent: human_or_authorized_caller
  assignment_materialization: selected_harness_when_project_assignment_extension_is_used
  assignment_approval: human_or_authorized_caller
  observed_model_identity: selected_observing_harness_or_adapter
lifecycle:
  creation: create first, validate next, then promote when promotion applies
  validation: deterministic first for deterministically checkable claims
  promotion: only after evidence-backed verification where promotion applies
  rollback: preserve prior package version and revert the active pointer
  retirement: archive with provenance and replacement note
architecture_change_policy:
  default_classification: EXTENSION
  required_drift_review: core-policies/drift-check.md
  classifications:
    - NO_DRIFT
    - EXTENSION
    - TENSION
    - REDEFINITION
  core_redefinition_label: CORE REDEFINITION
usage:
  read_order:
    - project.yaml
    - README.md
    - docs/beginner-guide.md
    - core-policies/core-identity.md
    - core-policies/drift-check.md
    - docs/architecture-layers.md
    - ARCHITECTURE.md
    - docs/INDEX.md
    - docs/operating-standard.md
    - docs/addendum-b-protocol-integrity.md
    - docs/addendum-a.md
    - docs/gaps-and-roadmap.md
    - PROJECT-PROFILE-REGRESSION-EVIDENCE.md
    - PROJECT-PROFILE-UNRESOLVED-DECISIONS.md
  registries:
    repository: registry/registry.yaml
    scoped:
      goal_driven_deep_research: registry/deep-research.yaml
  skills:
    model_package_design: skills/model-package-design/SKILL.md
    goal_driven_deep_research: skills/goal-driven-deep-research/SKILL.md
  agents:
    architecture_review: agents/architecture-review.md
  kickoff_templates:
    human: templates/project-kickoff.md
    machine: templates/project-kickoff.yaml
  project_definitions:
    index: projects/README.md
    profile_schema: schemas/project-profile.schema.json
    assignment_schema: schemas/llm-assignments.schema.json
    relocation_schema: schemas/project-relocation-record.schema.json
    profile_template: templates/project-profile.yaml
    assignment_template: templates/llm-assignments.json
    cli:
      validate: curo project validate
      compile: curo project compile
      verify_assignments: curo project verify-assignments
  observability:
    contract: observability/observability-contract.md
    run_record: observability/run-record-template.md
    run_index: observability/run-index-template.md
  learning:
    protocol: learning/learning-distillation-protocol.md
    candidate_template: learning/learning-candidate-template.yaml
    promotion_template: learning/promotion-record-template.yaml
  applied_reasoning_patterns:
    - normal_successful_execution
    - cancellation_or_early_termination
    - dependency_timeout_or_failure
    - missing_or_unverifiable_provenance
    - component_replacement
    - goal_driven_deep_research
  update_policy: >-
    Do not edit files outside this directory unless the change is explicitly
    intended for the broader workspace and has been checked first. Prefer bounded
    extensions over expansion of Curo core.
